# plugin_build.conf - build manifest for scripts/build_plugin.sh and scripts/build_plugin.py.
# Syntax is a restricted subset of bash: NAME="value" and NAME=( item item ).
# Every module the plugin imports must be covered by FILES or DIRS
# (tests/unit/test_manifest.py checks this).

PLUGIN="DocQGISProject"

FILES=(
  __init__.py
  docqgisproject.py
  metadata.txt
  LICENSE
  README.md
  CHANGELOG.md
)

DIRS=(
  core
  render
  gui
  processing_provider
  icons
)

VERIFY=(
  __init__.py
  docqgisproject.py
  core/
  core/collectors/
  core/runner.py
  core/redact.py
  core/safe_paths.py
  core/collectors/layers.py
  core/collectors/styling.py
  core/artifacts.py
  core/xmlwalk.py
  render/style_md.py
  render/md_out.py
  render/json_out.py
  render/
  gui/
  processing_provider/
  processing_provider/provider.py
  icons/icon.svg
  LICENSE
  metadata.txt
)

OUT="dist/DocQGISProject.zip"
